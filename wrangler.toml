name = "warera-market"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Frontend (public/) se servira kao statički asseti; /api/* obrađuje Worker
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "warera-market"
database_id = "78b7b8c5-5ac8-4031-80e5-2857cc4a1088"

# Prikupljanje transakcija svake minute
[triggers]
crons = ["* * * * *"]

[vars]
# Koliko API stranica (po 100 transakcija) Worker povuče u jednom cron pozivu.
# Uz 12 i 6 poziv ostaje ispod ograničenja besplatnog plana (50 upita po pozivu). Na plaćenom planu možeš povećati.
PAGE_BUDGET = "12"

# Koliko puta po cron pozivu smije pitati API za podatke o igračima (50 igrača po pozivu).
LOOKUP_BUDGET = "6"

# Pratimo transakcije u kojima je kupac ili prodavač iz ovih država (imena kako se zovu u igri).
# Prazno = sve države.
TRACKED_COUNTRIES = "Croatia,Cuba,Kyrgyzstan,Botswana"

# Koliko dana povijesti učitati unatrag.
# 0 = koliko god API čuva (može biti jako puno podataka); -1 = bez povijesti, prati se samo ono što stigne nakon objave.
HISTORY_DAYS = "30"

# Koliko upisanih redaka dnevno (UTC) smije potrošiti sinkronizacija prije nego povijest stane do iduće ponoći.
# Raspoređuje se kroz dan: u 06 h UTC povijest smije do četvrtine, u 12 h do polovice itd. (praćenje uživo ima prednost).
# Besplatni D1 dopušta 100 000; ostatak ostaje za nove transakcije i ostale upise, da praćenje uživo ne stane.
HISTORY_DAILY_WRITES = "70000"

# Od HISTORY_EOD_FROM (UTC, 23:30 = 00:30 po hrvatskom zimskom vremenu) do ponoći proračun za povijest raste na
# HISTORY_EOD_WRITES, da se iskoristi ostatak dnevnog limita prije reseta (ostavlja rezervu za upise koje brojač ne vidi).
HISTORY_EOD_FROM = "23:30"
HISTORY_EOD_WRITES = "85000"

# "trading" = tržište resursa (hrana, municija, građevinski materijal...); "itemMarket" = oprema/oružje
TX_TYPE = "trading"
