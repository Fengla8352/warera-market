<!doctype html>
<html lang="hr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>WarEra Market Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // tema se postavlja prije prikaza stranice da ne bljesne pogrešna
  try { var t = localStorage.getItem("wm_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root {
    --bg: #0f1218; --panel: #171c26; --panel-2: #1b202b; --line: #232a38;
    --text: #ffffff; --text-2: #e6e9ef; --muted: #8b94a7; --brand: #ddbb00;
    /* naglasak (odabrano, klikabilno, stupac po kojem se rangira): svjetlija plava za tamnu pozadinu */
    --gold: #7cb4ff;
    --buy: #4ade80; --sell: #f87171; --hl: #1c2b48; --hover: #1c2230;
    --tile-top: #0f1819; --tile-line: rgba(255,255,255,.08);
    --focus: #4cc9f0; --shadow: rgba(0,0,0,.6);
    --gold-text: var(--gold); --rank: var(--gold); --on-accent: #0b1220; --accent-soft: #24375c; --elev: none; --field-line: transparent; --thead: transparent;
    --t-gray: #23373b; --t-green: #0a3d28; --t-blue: #173065; --t-purple: #3b235f; --t-red: #581b1d; --t-olive: #353610;
  }
  :root[data-theme="light"] {
    --bg: #eef1f5; --panel: #ffffff; --panel-2: #f6f8fb; --line: #e2e6ed;
    --text: #0f141c; --text-2: #1f2633; --muted: #5b6476; 
    /* svijetla tema: tamnija plava za naglasak, naslov ostaje zlatni */
    --brand: #c08d00; --gold: #1d4ed8; --gold-text: #1d4ed8; --rank: #1d4ed8; --on-accent: #ffffff; --accent-soft: #c9d9ff;
    --buy: #15803d; --sell: #c62828; --hl: #e3ecff; --hover: #f7f9fc;
    --focus: #1d6fd8; --shadow: rgba(15,20,28,.35);
    --elev: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
    --field-line: #e2e6ed; --thead: #f6f8fb;
    /* svijetle inačice tier boja (isti ton kao u igri) */
    --tile-top: #f8fafc; --tile-line: rgba(15,20,28,.05);
    --t-gray: #c5cfd4; --t-green: #a9d8bb; --t-blue: #b2c6f2; --t-purple: #cbb6ec; --t-red: #eaadad; --t-olive: #d0d396;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  html[data-theme="light"] { color-scheme: light; }
  body { margin: 0; background: var(--bg); color: var(--text-2); font: 15px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 16px 56px; }

  h1.title { font: 400 34px/1.1 "Bowlby One", "Arial Black", Impact, sans-serif; margin: 0 0 18px; color: var(--text); letter-spacing: .2px; }
  h1.title span { color: var(--brand); }
  @media (max-width: 560px) { h1.title { font-size: 26px; } }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .field { position: relative; display: flex; align-items: center; background: var(--panel); border-radius: 10px; min-height: 48px; color: var(--text); border: 1px solid var(--field-line); box-shadow: var(--elev); }
  .field:focus-within { border-color: var(--focus); }
  .field input, .field select { background: transparent; color: inherit; border: 0; font: inherit; font-size: 16px; padding: 0 14px; height: 46px; width: 100%; outline: none; }
  .field input::placeholder { color: var(--text); opacity: .85; }
  .field svg { flex: none; width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .search { flex: 1 1 260px; padding-right: 14px; }
  .search input { padding-right: 8px; }
  .search input::-webkit-search-cancel-button { display: none; }
  .select { flex: 0 0 190px; padding-right: 12px; }
  .select select { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 6px; }
  .select option { background: var(--panel); color: var(--text); }
  .date { flex: 0 0 196px; padding-left: 6px; gap: 6px; }
  /* gumb kalendara: istaknut da se vidi da je klikabilan */
  .date .cal { display: grid; place-items: center; width: 34px; height: 34px; flex: none; background: var(--hl); border: 1px solid var(--line); padding: 0; color: var(--gold-text); cursor: pointer; border-radius: 8px; transition: background .12s, border-color .12s; }
  .date .cal svg { width: 18px; height: 18px; }
  .date .cal:hover, .field.date.active .cal { border-color: var(--gold); background: var(--hover); }
  :root[data-theme="light"] .date .cal:hover, :root[data-theme="light"] .field.date.active .cal { background: var(--accent-soft); }
  .date input[aria-invalid=true] { color: var(--sell); }
  .date .lab { color: var(--muted); font-size: 13px; }
  .date input.txt { padding: 0 6px 0 0; height: 46px; min-width: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
  .date input.txt::placeholder { color: var(--muted); opacity: 1; }
  .spacer { flex: 1 1 0; min-width: 0; }
  .field.date.active { border-color: var(--focus); }

  /* kalendar */
  .bar { position: relative; }
  .cal-pop { position: absolute; z-index: 20; top: calc(100% + 6px); display: flex; background: var(--panel); color: var(--text-2); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px var(--shadow); overflow: hidden; }
  .cal-pop[hidden] { display: none; }
  .presets { display: flex; flex-direction: column; padding: 8px; gap: 2px; border-right: 1px solid var(--line); min-width: 150px; }
  .presets button { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: none; border: 0; border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; color: var(--text-2); cursor: pointer; text-align: left; }
  .presets button:hover { background: var(--hover); }
  .presets button[aria-pressed=true] { color: var(--text); font-weight: 700; }
  .presets button[aria-pressed=true]::after { content: "✓"; color: var(--gold-text); font-weight: 700; }
  .calbox { padding: 10px 12px 8px; width: 280px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-head b { color: var(--text); font-size: 15px; text-transform: capitalize; }
  .cal-head button { background: none; border: 1px solid transparent; border-radius: 8px; width: 32px; height: 32px; font-size: 18px; color: var(--text-2); cursor: pointer; }
  .cal-head button:hover:not(:disabled) { border-color: var(--line); background: var(--hover); }
  .cal-head button:disabled { opacity: .3; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-grid .wd { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 0; text-transform: uppercase; }
  .cal-grid button { height: 34px; border: 0; border-radius: 8px; background: none; font: inherit; font-size: 14px; color: var(--text-2); cursor: pointer; font-variant-numeric: tabular-nums; }
  .cal-grid button:hover:not(:disabled) { background: var(--hover); }
  .cal-grid button:disabled { color: var(--muted); opacity: .35; cursor: default; }
  .cal-grid button.in { background: var(--hl); border-radius: 0; }
  .cal-grid button.today { box-shadow: inset 0 0 0 1px var(--line); }
  .cal-grid button.sel { background: var(--gold); color: var(--on-accent); font-weight: 700; }
  .cal-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; font-size: 12px; color: var(--muted); }
  .cal-foot button { background: none; border: 0; color: var(--focus); font: inherit; font-size: 13px; cursor: pointer; padding: 4px 6px; }
  @media (max-width: 560px) {
    .cal-pop { left: 0 !important; right: 0; flex-direction: column; }
    .presets { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); min-width: 0; }
    .presets button { padding: 6px 10px; border: 1px solid var(--line); }
    .presets button[aria-pressed=true]::after { content: none; }
    .presets button[aria-pressed=true] { border-color: var(--gold); }
    .calbox { width: auto; }
  }
  .theme { position: relative; width: 62px; height: 32px; padding: 0; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--elev); cursor: pointer; margin-left: auto; align-self: center; flex: none; }
  .theme::before { content: ""; box-sizing: border-box; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--hl); border: 1px solid var(--gold); transform: translateX(30px); }
  .theme[aria-checked=false]::before { transform: none; }
  .theme svg { position: absolute; top: 7px; width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .theme .sun { left: 7px; } .theme .moon { right: 7px; }
  .theme[aria-checked=true] .moon, .theme[aria-checked=false] .sun { stroke: var(--gold); }
  .theme:hover { border-color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) { .theme::before { transition: transform .2s; } }
  button:focus-visible, .tile:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* red itema */
  .items-wrap { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-wrap: nowrap; gap: 6px; align-items: center; overflow-x: auto; box-shadow: var(--elev); }
  .tile { --s: 36px; position: relative; width: var(--s); height: var(--s); flex: none; padding: 0; border: 1px solid var(--tile-line); border-radius: 6px; cursor: pointer; display: grid; place-items: center;
    background: linear-gradient(180deg, var(--tile-top) 0%, var(--tier, var(--t-gray)) 100%) border-box; transition: opacity .12s, transform .12s; }
  .tile img { width: 78%; height: 78%; object-fit: contain; pointer-events: none; }
  .t-gray { --tier: var(--t-gray); } .t-green { --tier: var(--t-green); } .t-blue { --tier: var(--t-blue); }
  .t-purple { --tier: var(--t-purple); } .t-red { --tier: var(--t-red); } .t-olive { --tier: var(--t-olive); }
  .items-wrap .tile:not(.on) { opacity: .42; }
  .items-wrap .tile:not(.on):hover { opacity: .85; }
  :root[data-theme="light"] .items-wrap .tile:not(.on) { opacity: .72; }
  /* jednake širine, popune cijeli red; na uskom ekranu najmanje 34 px i red se pomiče vodoravno */
  .items-wrap .tile { flex: 1 1 0; width: auto; height: auto; min-width: 34px; max-width: 52px; aspect-ratio: 1 / 1; }
  .tile.on { outline: 2px solid var(--gold); outline-offset: 1px; }
  .tile:hover { transform: translateY(-1px); }
  .items-meta { display: flex; align-items: center; gap: 10px; margin: 8px 2px 0; color: var(--muted); font-size: 13px; min-height: 24px; }
  .items-meta b { color: var(--text-2); font-weight: 600; }

  /* upozorenja */
  .stale, .note { margin-top: 12px; border-radius: 10px; padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
  .stale[hidden], .note[hidden] { display: none; }
  .stale { background: color-mix(in srgb, var(--sell) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--sell) 45%, var(--line)); color: var(--text); }
  .stale::before { content: "⚠"; color: var(--sell); font-weight: 700; }
  .note { background: var(--panel); border: 1px solid var(--line); color: var(--text-2); font-size: 13px; box-shadow: var(--elev); }
  .note::before { content: "ℹ"; color: var(--rank); font-weight: 700; }
  .cal-grid button.partial:not(.sel):not(:disabled) { color: var(--muted); text-decoration: underline dotted; text-underline-offset: 3px; }

  /* pregled iznad tablice */
  .ov { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; align-items: stretch; }
  .ov[aria-busy=true] { opacity: .6; }
  .ov-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--elev); min-width: 0; }
  .ov-side { display: grid; gap: 14px; align-content: start; min-width: 0; }
  .ov h3 { margin: 0 0 10px; font-size: 14px; color: var(--text); font-weight: 700; }
  .kpi { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .kpi small { display: block; color: var(--muted); font-size: 12px; }
  .kpi b { color: var(--text); font-size: 18px; font-variant-numeric: tabular-nums; }
  /* lijeva kartica je iste visine kao desni stupac; graf popunjava ostatak */
  .ov > .ov-card { display: flex; flex-direction: column; }
  .ov-chart { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 190px; }
  .ov-axis { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .pwrap { position: relative; flex: 1; min-height: 150px; }
  .ov-chart svg { display: block; position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ov-chart .grid { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .ov-chart .pline { fill: none; stroke: var(--rank); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .ov-chart .cross { stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .pdot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--rank); box-shadow: 0 0 0 2px var(--panel); pointer-events: none; }
  .ov-chart .tip { top: 22px; }
  .ov table { min-width: 0; }
  .ov th, .ov td { padding: 6px 4px; font-size: 13px; }
  .ov th { background: none; }
  .ov tr:hover { background: none; }
  .ov tbody tr { cursor: default; }
  .ov ol { list-style: none; margin: 0; padding: 0; }
  .ov li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: baseline; column-gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ov li:last-child { border-bottom: 0; }
  .ov li .rk { color: var(--muted); font-variant-numeric: tabular-nums; }
  .ov li button { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ov li button:hover { color: var(--rank); }
  .ov li small { grid-column: 2; color: var(--muted); font-size: 12px; }
  .ov li .num { grid-column: 3; grid-row: 1; font-variant-numeric: tabular-nums; color: var(--text-2); }
  .ov li .num b { color: var(--rank); }
  .ov li.empty { display: block; color: var(--muted); font-size: 13px; }
  @media (max-width: 760px) { .ov { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { .kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ov th { letter-spacing: 0; font-size: 11px; } .ov-card { padding: 12px; } }

  /* tablica */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 14px; box-shadow: var(--elev); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th, td { padding: 11px 14px; text-align: left; white-space: nowrap; }
  th { background: var(--thead); color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line); }
  td { border-bottom: 1px solid var(--line); }
  tbody tr:last-child td { border-bottom: 0; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.rank, th.rank { width: 56px; color: var(--muted); font-variant-numeric: tabular-nums; }
  th button { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
  th button:hover { color: var(--text); }
  th[aria-sort="descending"] button { color: var(--rank); }
  td .sub { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  td.num .sub { display: none; font-variant-numeric: tabular-nums; }
  .money { font-variant-numeric: tabular-nums; }
  th[aria-sort="descending"] button::after { content: "↓"; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  td.name button { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; text-align: left; }
  td.name .sub { display: none; }
  td.main { color: var(--rank); font-weight: 700; }
  td.empty { padding: 36px; text-align: center; color: var(--muted); white-space: normal; }
  .card[aria-busy="true"] tbody { opacity: .55; }
  .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 10px; color: var(--muted); font-size: 13px; }
  .pager button { background: var(--panel); color: var(--text); border: 1px solid var(--line); box-shadow: var(--elev); border-radius: 8px; padding: 9px 14px; font: inherit; font-size: 14px; cursor: pointer; min-width: 110px; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .status { margin-top: 22px; color: var(--muted); font-size: 12px; }
  .status b { color: var(--text-2); font-weight: 600; }
  .err { color: var(--sell); }

  /* prozor igrača */
  dialog { background: var(--panel); color: var(--text-2); border: 1px solid var(--line); border-radius: 14px; width: min(760px, 94vw); padding: 0; }
  dialog::backdrop { background: var(--shadow); }
  .dhead { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 20px 6px; gap: 12px; }
  .dhead h2 { margin: 0; font-size: 20px; color: var(--text); }
  .dsub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .dhead button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 8px; padding: 10px 20px 14px; max-height: 30vh; overflow: auto; }
  .chip { display: flex; gap: 10px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .chip .tile { --s: 34px !important; cursor: default; }
  .chip .tile { opacity: 1 !important; }
  .chip .tile:hover { transform: none; }
  .chip small { display: block; color: var(--muted); font-size: 11px; line-height: 1.3; }
  .chip span { font-variant-numeric: tabular-nums; font-size: 13px; }
  .dbody { max-height: 34vh; overflow: auto; border-top: 1px solid var(--line); }
  .chart { position: relative; padding: 4px 20px 12px; }
  .chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .legend > span { white-space: nowrap; }
  .xlab { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .chart svg { display: block; width: 100%; height: 132px; overflow: visible; }
  .chart .base { stroke: var(--line); stroke-width: 1; }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hit:hover, .chart .hit:focus { fill: var(--hover); outline: none; }
  .chart .b-buy { fill: var(--buy); } .chart .b-sell { fill: var(--sell); }
  .tip { position: absolute; pointer-events: none; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; color: var(--text-2); box-shadow: 0 6px 18px var(--shadow); white-space: nowrap; z-index: 2; }
  .tip b { color: var(--text); font-variant-numeric: tabular-nums; }
  .tip .k { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 6px; }
  .dbody table { min-width: 0; }
  .dbody th, .dbody td { padding: 8px 14px; }
  .item-cell { display: inline-flex; align-items: center; gap: 8px; }
  .item-cell .tile { --s: 24px !important; cursor: default; border-radius: 4px; opacity: 1 !important; }
  .item-cell .tile:hover { transform: none; }
  .buy { color: var(--buy); } .sell { color: var(--sell); }
  @media (max-width: 560px) {
    table { min-width: 0; }
    th, td { padding: 10px 6px; font-size: 14px; }
    th { font-size: 11px; letter-spacing: .02em; }
    th:first-child, td:first-child { padding-left: 12px; }
    th:last-child, td:last-child { padding-right: 12px; }
    td.name { white-space: normal; overflow-wrap: anywhere; }
    th.ctry, td.ctry, th.mny, td.mny { display: none; }
    td.num .sub { display: block; }
    td.name .sub { display: block; }
    th.rank, td.rank { width: 30px; }
    .field, .search, .select, .date { flex: 1 1 100%; }
    .date { flex: 1 1 calc(50% - 5px); }
  }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title"><span>WarEra</span> Market Rankings</h1>

  <div class="bar">
    <label class="field search">
      <input id="q" type="search" placeholder="Traži igrača" autocomplete="off" aria-label="Traži igrača">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </label>
    <div class="field select">
      <select id="country" aria-label="Država"><option value="">Država</option></select>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="field date">
      <button type="button" class="cal" data-for="from" aria-label="Odaberi datum (od)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
      <span class="lab">Od</span><input id="from" class="txt" type="text" inputmode="numeric" autocomplete="off" placeholder="dd/mm/yyyy" maxlength="10" aria-label="Od datuma (dd/mm/yyyy)">
    </div>
    <div class="field date">
      <button type="button" class="cal" data-for="to" aria-label="Odaberi datum (do)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
      <span class="lab">Do</span><input id="to" class="txt" type="text" inputmode="numeric" autocomplete="off" placeholder="dd/mm/yyyy" maxlength="10" aria-label="Do datuma (dd/mm/yyyy)">
    </div>
    <button type="button" class="theme" id="theme" role="switch" aria-checked="true" aria-label="Tamni način">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
    <div class="cal-pop" id="cal-pop" role="dialog" aria-label="Odabir razdoblja" hidden>
      <div class="presets" id="presets">
        <button type="button" data-p="today">Danas</button>
        <button type="button" data-p="yesterday">Jučer</button>
        <button type="button" data-p="7">Zadnjih 7 dana</button>
        <button type="button" data-p="30">Zadnjih 30 dana</button>
        <button type="button" data-p="all">Cijelo razdoblje</button>
      </div>
      <div class="calbox">
        <div class="cal-head">
          <button type="button" id="cal-prev" aria-label="Prethodni mjesec">‹</button>
          <b id="cal-title"></b>
          <button type="button" id="cal-next" aria-label="Sljedeći mjesec">›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-foot"><span id="cal-hint"></span><button type="button" id="cal-clear">Očisti</button></div>
      </div>
    </div>
  </div>

  <div class="items-wrap" id="items" role="group" aria-label="Itemi koji se prate"></div>
  <div class="items-meta"><span id="items-hint"></span></div>
  <div class="stale" id="stale" role="status" hidden></div>
  <div class="note" id="note" hidden></div>

  <section class="ov" id="ov" aria-busy="false">
    <div class="ov-card">
      <h3 id="ov-title">Prosječna cijena</h3>
      <div class="kpi" id="ov-kpi"></div>
      <div class="ov-chart" id="ov-chart"></div>
    </div>
    <div class="ov-side">
      <div class="ov-card">
        <h3>Po državama</h3>
        <table><thead><tr><th>Država</th><th class="num">Kupljeno</th><th class="num">Potrošeno</th><th class="num" title="Prosječna cijena po komadu">Cijena</th></tr></thead><tbody id="ov-countries"></tbody></table>
      </div>
      <div class="ov-card">
        <h3 id="ov-today-h">Danas najviše kupili</h3>
        <ol id="ov-today"></ol>
      </div>
    </div>
  </section>

  <div class="card" id="card" aria-busy="false"><div class="scroll">
    <table>
      <thead><tr>
        <th class="rank">#</th><th>Igrač</th><th class="ctry">Država</th>
        <th class="num" aria-sort="descending"><button type="button" data-sort="bought" data-alt="spent">Kupljeno</button></th>
        <th class="num mny" aria-sort="none"><button type="button" data-sort="spent">Potrošeno</button></th>
        <th class="num" aria-sort="none"><button type="button" data-sort="sold" data-alt="earned">Prodano</button></th>
        <th class="num mny" aria-sort="none"><button type="button" data-sort="earned">Zarađeno</button></th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">Učitavanje…</td></tr></tbody>
    </table>
  </div></div>

  <div class="pager">
    <button type="button" id="prev">← Prethodna</button>
    <span id="page"></span>
    <button type="button" id="next">Sljedeća →</button>
  </div>
  <div class="status" id="status"></div>
</div>

<dialog id="dlg" aria-labelledby="d-name">
  <div class="dhead">
    <div><h2 id="d-name"></h2><div class="dsub" id="d-meta"></div></div>
    <button type="button" id="d-close">Zatvori</button>
  </div>
  <div class="chips" id="d-chips"></div>
  <div class="chart" id="d-chart"></div>
  <div class="dbody"><table>
    <thead><tr><th>Vrijeme</th><th>Tip</th><th>Item</th><th class="num">Kol.</th><th class="num">Iznos</th><th>Protustranka</th></tr></thead>
    <tbody id="d-rows"></tbody>
  </table></div>
</dialog>

<script>
(() => {
  const LIMIT = 50;
  const $ = (id) => document.getElementById(id);
  const state = { item: null, offset: 0, sort: "bought", meta: new Map(), seq: 0 };
  const fmtDT = (iso) => { const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const fmt = (n) => Number(n || 0).toLocaleString("hr-HR");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  async function api(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }

  /* ---------- tema ---------- */
  const themeBtn = $("theme");
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    themeBtn.setAttribute("aria-checked", String(t === "dark"));
    themeBtn.setAttribute("aria-label", t === "dark" ? "Prebaci na svijetli način" : "Prebaci na tamni način");
  }
  applyTheme(document.documentElement.dataset.theme === "light" ? "light" : "dark");
  themeBtn.addEventListener("click", () => {
    const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    applyTheme(t); store.set("wm_theme", t);
  });

  /* ---------- datumi (dd/mm/yyyy, dani su UTC kao u bazi) ---------- */
  const pad = (n) => String(n).padStart(2, "0");
  const isoToHr = (iso) => (iso ? iso.split("-").reverse().join("/") : "");
  function hrToIso(v) {
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v);
    if (!m) return "";
    const iso = `${m[3]}-${m[2]}-${m[1]}`;
    const d = new Date(iso + "T00:00:00Z");
    return !Number.isNaN(d.getTime()) && d.toISOString().slice(0, 10) === iso ? iso : "";
  }
  const maskDate = (raw) => {
    const d = raw.replace(/\D/g, "").slice(0, 8);
    return d.length > 4 ? `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}/${d.slice(2)}` : d;
  };
  const dateIso = (id) => hrToIso($(id).value);
  const validIso = (v) => (v && hrToIso(isoToHr(v)) === v ? v : "");
  const todayIso = () => new Date().toISOString().slice(0, 10);
  const addDays = (iso, n) => new Date(Date.parse(iso + "T00:00:00Z") + n * 86400000).toISOString().slice(0, 10);
  function setDates(from, to) {
    $("from").value = isoToHr(from); $("to").value = isoToHr(to);
    $("from").setAttribute("aria-invalid", "false"); $("to").setAttribute("aria-invalid", "false");
  }
  for (const id of ["from", "to"]) {
    const inp = $(id);
    inp.addEventListener("input", (e) => {
      const deleting = e.inputType && e.inputType.startsWith("delete");
      inp.value = deleting ? inp.value.replace(/[^\d/]/g, "").slice(0, 10) : maskDate(inp.value);
      const full = inp.value.length === 10;
      const iso = hrToIso(inp.value);
      inp.setAttribute("aria-invalid", String(full && !iso));
      if (iso) { cal.month = iso.slice(0, 7); renderCal(); }
      if (!inp.value || iso) reload();
    });
    inp.addEventListener("focus", () => openCal(id));
  }
  for (const b of document.querySelectorAll(".date .cal")) b.onclick = () => openCal(b.dataset.for, true);

  /* ---------- kalendar ---------- */
  const MONTHS = ["siječanj", "veljača", "ožujak", "travanj", "svibanj", "lipanj", "srpanj", "kolovoz", "rujan", "listopad", "studeni", "prosinac"];
  const cal = { field: null, month: todayIso().slice(0, 7), min: null, max: null };
  const pop = $("cal-pop");
  function openCal(field, focusGrid) {
    cal.field = field;
    const v = dateIso(field) || (field === "to" && dateIso("from")) || todayIso();
    cal.month = v.slice(0, 7);
    for (const f of ["from", "to"]) $(f).closest(".field").classList.toggle("active", f === field);
    const anchor = $(field).closest(".field");
    pop.hidden = false;
    // poravnaj ispod polja, ali unutar trake
    const bar = pop.parentElement.getBoundingClientRect(), a = anchor.getBoundingClientRect();
    pop.style.left = Math.max(0, Math.min(a.left - bar.left, bar.width - pop.offsetWidth)) + "px";
    pop.style.top = (a.bottom - bar.top + 6) + "px";
    renderCal();
    if (focusGrid) (pop.querySelector(".cal-grid button.sel") || pop.querySelector(".cal-grid button:not(:disabled)"))?.focus();
  }
  function closeCal() {
    pop.hidden = true; cal.field = null;
    for (const f of ["from", "to"]) $(f).closest(".field").classList.remove("active");
  }
  function activePreset() {
    const f = dateIso("from"), t = dateIso("to"), td = todayIso();
    if (!f && !t) return "all";
    if (f === td && t === td) return "today";
    if (f === addDays(td, -1) && t === addDays(td, -1)) return "yesterday";
    if (t === td && f === addDays(td, -6)) return "7";
    if (t === td && f === addDays(td, -29)) return "30";
    return "";
  }
  function renderCal() {
    const [y, m] = cal.month.split("-").map(Number);
    $("cal-title").textContent = `${MONTHS[m - 1]} ${y}`;
    const first = `${cal.month}-01`;
    const lead = (new Date(first + "T00:00:00Z").getUTCDay() + 6) % 7; // ponedjeljak prvi
    const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const f = dateIso("from"), t = dateIso("to"), td = todayIso();
    const max = cal.max && cal.max > td ? cal.max : td;
    let html = ["Pon", "Uto", "Sri", "Čet", "Pet", "Sub", "Ned"].map((d) => `<span class="wd">${d}</span>`).join("");
    html += "<span></span>".repeat(lead);
    for (let d = 1; d <= days; d++) {
      const iso = `${cal.month}-${pad(d)}`;
      const off = (cal.min && iso < cal.min) || iso > max;
      const sel = iso === f || iso === t;
      const inR = f && t && iso > f && iso < t;
      const partial = state.completeFrom && iso <= state.completeFrom.slice(0, 10);
      html += `<button type="button" data-d="${iso}" class="${sel ? "sel" : ""} ${inR ? "in" : ""} ${iso === td ? "today" : ""} ${partial ? "partial" : ""}"` +
        ` aria-label="${d}. ${MONTHS[m - 1]} ${y}${partial ? ", podaci nepotpuni" : ""}" ${partial ? 'title="Podaci za ovaj dan nisu potpuni"' : ""} aria-pressed="${sel}" ${off ? "disabled" : ""}>${d}</button>`;
    }
    $("cal-grid").innerHTML = html;
    $("cal-prev").disabled = Boolean(cal.min && first <= cal.min);
    $("cal-next").disabled = addDays(`${cal.month}-${pad(days)}`, 1) > max;
    $("cal-hint").textContent = (cal.field === "to" ? "Odaberi završni dan" : "Odaberi početni dan") +
      (state.completeFrom ? ` · potpuno od ${isoToHr(state.completeFrom.slice(0, 10))}` : "");
    const ap = activePreset();
    for (const b of $("presets").children) b.setAttribute("aria-pressed", String(b.dataset.p === ap));
  }
  const shiftMonth = (n) => { const [y, m] = cal.month.split("-").map(Number); const d = new Date(Date.UTC(y, m - 1 + n, 1)); cal.month = d.toISOString().slice(0, 7); renderCal(); };
  $("cal-prev").onclick = () => shiftMonth(-1);
  $("cal-next").onclick = () => shiftMonth(1);
  $("cal-grid").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-d]");
    if (!b || b.disabled) return;
    const d = b.dataset.d;
    if (cal.field === "from") {
      const t = dateIso("to");
      setDates(d, t && t >= d ? t : "");
      reload(); openCal("to"); $("to").focus({ preventScroll: true });
    } else {
      const f = dateIso("from");
      if (f && d < f) setDates(d, f); else setDates(f, d);
      reload(); closeCal();
    }
  });
  $("cal-grid").addEventListener("keydown", (e) => {
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
    const b = e.target.closest("button[data-d]");
    if (!step || !b) return;
    e.preventDefault();
    const n = addDays(b.dataset.d, step);
    if (n.slice(0, 7) !== cal.month) { cal.month = n.slice(0, 7); renderCal(); }
    const nb = $("cal-grid").querySelector(`button[data-d="${n}"]:not(:disabled)`);
    if (nb) nb.focus();
  });
  $("presets").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-p]");
    if (!b) return;
    const td = todayIso(), p = b.dataset.p;
    if (p === "all") setDates("", "");
    else if (p === "today") setDates(td, td);
    else if (p === "yesterday") setDates(addDays(td, -1), addDays(td, -1));
    else setDates(addDays(td, -(Number(p) - 1)), td);
    reload(); closeCal();
  });
  $("cal-clear").onclick = () => { setDates("", ""); reload(); renderCal(); };
  document.addEventListener("pointerdown", (e) => {
    if (!pop.hidden && !pop.contains(e.target) && !e.target.closest(".field.date")) closeCal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !pop.hidden) { const f = cal.field; closeCal(); $(f)?.focus({ preventScroll: true }); }
  });
  pop.addEventListener("focusout", (e) => {
    if (!pop.hidden && e.relatedTarget && !pop.contains(e.relatedTarget) && !e.relatedTarget.closest(".field.date")) closeCal();
  });

  /* ---------- itemi ---------- */
  const tile = (code, extra = "") => {
    const m = state.meta.get(code) || { name: code, tier: "gray" };
    return `<span class="tile t-${esc(m.tier)} ${extra}" title="${esc(m.name)}"><img src="/icons/${encodeURIComponent(code)}.webp" alt="${esc(m.name)}" width="28" height="28" loading="lazy"></span>`;
  };

  function renderItems(items) {
    $("items").innerHTML = items.map((m) =>
      `<button type="button" class="tile t-${esc(m.tier)}" data-code="${esc(m.code)}" aria-pressed="false" aria-label="${esc(m.name)}" title="${esc(m.name)}">` +
      `<img src="/icons/${encodeURIComponent(m.code)}.webp" alt="" width="28" height="28"></button>`).join("");
    syncItems();
  }

  function syncItems() {
    for (const b of $("items").querySelectorAll(".tile")) {
      const on = b.dataset.code === state.item;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", String(on));
    }
    const m = state.meta.get(state.item);
    $("items-hint").innerHTML = m ? `Odabrani item: <b>${esc(m.name)}</b>` : "";
  }

  $("items").addEventListener("click", (e) => {
    const b = e.target.closest(".tile");
    if (!b || b.dataset.code === state.item) return;
    state.item = b.dataset.code;
    store.set("wm_item", state.item);
    syncItems();
    reload();
  });

  /* ---------- filteri ---------- */
  function periodParams(p) {
    let from = dateIso("from"), to = dateIso("to");
    if (from && to && from > to) [from, to] = [to, from];
    if (from) p.set("from", from);
    if (to) p.set("to", to);
    if (state.item) p.set("items", state.item);
    return p;
  }

  // filteri u adresi stranice: ?item=…&country=…&from=…&to=…&sort=…&q=… (link otvara isti prikaz)
  const SORTS = ["bought", "spent", "sold", "earned"];
  const urlIn = new URLSearchParams(location.search);
  function writeUrl() {
    const u = new URLSearchParams();
    if (state.item) u.set("item", state.item);
    if ($("country").value) u.set("country", $("country").value);
    const f = dateIso("from"), t = dateIso("to");
    if (f) u.set("from", f);
    if (t) u.set("to", t);
    if (state.sort !== "bought") u.set("sort", state.sort);
    if ($("q").value.trim()) u.set("q", $("q").value.trim());
    const qs = u.toString();
    try { history.replaceState(null, "", qs ? "?" + qs : location.pathname); } catch {}
  }

  async function loadFilters() {
    const f = await api("/api/filters");
    state.meta = new Map(f.items.map((m) => [m.code, m]));
    renderItems(f.items);
    for (const c of f.countries) $("country").insertAdjacentHTML("beforeend", `<option value="${esc(c.id)}">${esc(c.name || c.id)}</option>`);
    if (urlIn.get("country")) $("country").value = urlIn.get("country");
    cal.min = f.days.min || null; cal.max = f.days.max || null;
    if (!state.meta.has(state.item)) state.item = f.items[0] ? f.items[0].code : null;
    syncItems();
  }

  /* ---------- tablica ---------- */
  const fmtM = (n) => Number(n || 0).toLocaleString("hr-HR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  // na mobitelu su vidljiva samo dva stupca (količina, novac ispod); dodir mijenja sortiranje količina <-> novac
  const narrow = window.matchMedia("(max-width: 560px)");
  const LABEL = { bought: "Kupljeno", spent: "Potrošeno", sold: "Prodano", earned: "Zarađeno" };
  function syncSortHeaders() {
    for (const b of document.querySelectorAll("th button[data-sort]")) {
      const active = b.dataset.sort === state.sort || (narrow.matches && b.dataset.alt === state.sort);
      b.closest("th").setAttribute("aria-sort", active ? "descending" : "none");
      if (b.dataset.alt) b.textContent = narrow.matches && b.dataset.alt === state.sort ? LABEL[b.dataset.alt] : LABEL[b.dataset.sort];
    }
  }
  narrow.addEventListener?.("change", syncSortHeaders);
  async function load() {
    const my = ++state.seq;
    writeUrl();
    const p = periodParams(new URLSearchParams({ limit: LIMIT, offset: state.offset, sort: state.sort }));
    if ($("q").value.trim()) p.set("q", $("q").value.trim());
    if ($("country").value) p.set("country", $("country").value);
    $("card").setAttribute("aria-busy", "true");
    let data;
    try { data = await api("/api/ranking?" + p); }
    catch { if (my === state.seq) { $("rows").innerHTML = `<tr><td colspan="7" class="empty err">Greška pri dohvaćanju podataka.</td></tr>`; $("card").setAttribute("aria-busy", "false"); } return; }
    if (my !== state.seq) return; // stigao je noviji zahtjev
    $("card").setAttribute("aria-busy", "false");
    const tb = $("rows");
    const pair = { bought: "spent", sold: "earned" };
    const cls = (k) => `num ${k === "spent" || k === "earned" ? "money mny" : ""} ${state.sort === k || (narrow.matches && pair[k] === state.sort) ? "main" : ""}`;
    if (!data.rows.length) {
      tb.innerHTML = `<tr><td colspan="7" class="empty">Nema rezultata za odabrane filtere.</td></tr>`;
    } else {
      tb.innerHTML = data.rows.map((r) => `
        <tr data-id="${esc(r.user_id)}">
          <td class="rank">${r.rank}</td>
          <td class="name"><button type="button">${esc(r.name || r.user_id)}</button><span class="sub">${esc(r.country_name || "")}</span></td>
          <td class="ctry">${esc(r.country_name || "–")}</td>
          <td class="${cls("bought")}">${fmt(r.bought)}<span class="sub">${fmtM(r.spent)}</span></td>
          <td class="${cls("spent")}">${fmtM(r.spent)}</td>
          <td class="${cls("sold")}">${fmt(r.sold)}<span class="sub">${fmtM(r.earned)}</span></td>
          <td class="${cls("earned")}">${fmtM(r.earned)}</td>
        </tr>`).join("");
    }
    $("prev").disabled = state.offset === 0;
    $("next").disabled = !data.hasMore;
    $("page").textContent = data.rows.length ? `Prikaz ${state.offset + 1}–${state.offset + data.rows.length}` : "";
  }

  const reload = () => { state.offset = 0; load(); loadOverview(); syncNote(); };

  let timer;
  $("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(reload, 300); });
  $("country").addEventListener("change", reload);
  $("prev").onclick = () => { state.offset = Math.max(0, state.offset - LIMIT); load(); window.scrollTo({ top: 0 }); };
  $("next").onclick = () => { state.offset += LIMIT; load(); window.scrollTo({ top: 0 }); };
  for (const b of document.querySelectorAll("th button[data-sort]")) {
    b.onclick = () => {
      // mobitel: drugi dodir na isti stupac prebacuje na novac i natrag
      state.sort = narrow.matches && b.dataset.alt && state.sort === b.dataset.sort ? b.dataset.alt : b.dataset.sort;
      syncSortHeaders(); reload();
    };
  }

  /* ---------- prozor igrača ---------- */
  const svgEl = (tag, attrs) => { const el = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
  // stupac sa zaobljenim krajem podatka, a ravnim uz osnovnu liniju
  function barPath(x, w, y0, h, up) {
    const r = Math.min(4, w / 2, h);
    if (h <= 0) return "";
    const y1 = up ? y0 - h : y0 + h, s = up ? 1 : -1;
    return `M${x},${y0} V${y1 + s * r} Q${x},${y1} ${x + r},${y1} H${x + w - r} Q${x + w},${y1} ${x + w},${y1 + s * r} V${y0} Z`;
  }
  function renderChart(perDay, from, to) {
    const box = $("d-chart");
    box.textContent = "";
    if (!perDay.length) return;
    const byDay = new Map(perDay.map((d) => [d.day, d]));
    let a = from || perDay[0].day, b = to || perDay[perDay.length - 1].day;
    if (a > b) [a, b] = [b, a];
    const days = [];
    for (let d = a; d <= b && days.length < 120; d = addDays(d, 1)) days.push(byDay.get(d) || { day: d, bought: 0, sold: 0, spent: 0, earned: 0 });
    const W = 700, H = 132, top = 4, bottom = 0, mid = top + (H - top - bottom) / 2, half = (H - top - bottom) / 2 - 2;
    const max = Math.max(1, ...days.map((d) => Math.max(d.bought, d.sold)));
    const slot = W / days.length, bw = Math.max(2, Math.min(18, slot - 2));
    const head = document.createElement("div");
    head.className = "chart-head";
    head.innerHTML = `<span>Promet po danima (UTC) · najviše ${fmt(max)} kom/dan</span>` +
      `<span class="legend"><span><i style="background:var(--buy)"></i>Kupljeno (gore)</span><span><i style="background:var(--sell)"></i>Prodano (dolje)</span></span>`;
    box.append(head);
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", role: "img", "aria-label": "Graf prometa po danima" });
    svg.append(svgEl("line", { x1: 0, x2: W, y1: mid, y2: mid, class: "base" }));
    const tip = document.createElement("div");
    tip.className = "tip"; tip.hidden = true;
    days.forEach((d, i) => {
      const x = i * slot + (slot - bw) / 2;
      const hit = svgEl("rect", { x: i * slot, y: 0, width: slot, height: H - bottom, class: "hit", tabindex: "0" });
      svg.append(hit);
      const hb = (d.bought / max) * half, hs = (d.sold / max) * half;
      if (hb > 0) svg.append(svgEl("path", { d: barPath(x, bw, mid - 1, Math.max(hb, 1.5), true), class: "b-buy", "pointer-events": "none" }));
      if (hs > 0) svg.append(svgEl("path", { d: barPath(x, bw, mid + 1, Math.max(hs, 1.5), false), class: "b-sell", "pointer-events": "none" }));
      const show = () => {
        tip.textContent = "";
        const t = document.createElement("div"); t.textContent = isoToHr(d.day); tip.append(t);
        for (const [k, q, mny, col] of [["Kupljeno", d.bought, d.spent, "var(--buy)"], ["Prodano", d.sold, d.earned, "var(--sell)"]]) {
          const row = document.createElement("div");
          row.innerHTML = `<span class="k" style="background:${col}"></span>`;
          const v = document.createElement("b"); v.textContent = `${fmt(q)} kom`; row.append(v, ` · ${fmtM(mny)} · ${k}`);
          tip.append(row);
        }
        tip.hidden = false;
        const bx = box.getBoundingClientRect(), hr = hit.getBoundingClientRect();
        const left = hr.left - bx.left + hr.width / 2 - tip.offsetWidth / 2;
        tip.style.left = Math.max(4, Math.min(left, bx.width - tip.offsetWidth - 4)) + "px";
        tip.style.top = "26px";
      };
      hit.addEventListener("pointerenter", show); hit.addEventListener("focus", show);
      hit.addEventListener("pointerleave", () => (tip.hidden = true)); hit.addEventListener("blur", () => (tip.hidden = true));
    });
    // oznake datuma (HTML, da se tekst ne rasteže sa SVG-om): prvi, srednji, zadnji
    const xl = document.createElement("div");
    xl.className = "xlab";
    for (const i of [...new Set([0, Math.floor((days.length - 1) / 2), days.length - 1])]) {
      const t = document.createElement("span"); t.textContent = isoToHr(days[i].day).slice(0, 5); xl.append(t);
    }
    box.append(svg, xl, tip);
  }

  $("rows").addEventListener("click", (e) => {
    const tr = e.target.closest("tr[data-id]");
    if (tr) openPlayer(tr.dataset.id, tr.querySelector(".name button").textContent);
  });
  async function openPlayer(id, name) {
    $("d-name").textContent = name;
    $("d-meta").textContent = "Učitavanje…";
    $("d-chips").innerHTML = ""; $("d-rows").innerHTML = ""; $("d-chart").textContent = "";
    $("dlg").showModal();
    try {
      const p = periodParams(new URLSearchParams());
      const { player, per_item, per_day, recent, truncated } = await api("/api/player/" + encodeURIComponent(id) + "?" + p);
      const fi = p.get("from"), ti = p.get("to");
      const period = fi || ti ? ` · ${isoToHr(fi) || "početak"} – ${isoToHr(ti) || "danas"}` : " · cijelo razdoblje";
      $("d-meta").textContent = (player.country_name || "ID " + player.user_id) + period;
      $("d-chips").innerHTML = per_item.length ? per_item.map((r) => {
        const m = state.meta.get(r.item_code);
        const avgB = r.bought ? r.spent / r.bought : null, avgS = r.sold ? r.earned / r.sold : null;
        return `<div class="chip">${tile(r.item_code)}<div><small>${esc(m ? m.name : r.item_code)}</small>` +
          `<span class="buy">K ${fmt(r.bought)}</span> · ${fmtM(r.spent)}` + (avgB ? ` <small>prosjek ${fmtM(avgB)}/kom</small>` : "") +
          `<br><span class="sell">P ${fmt(r.sold)}</span> · ${fmtM(r.earned)}` + (avgS ? ` <small>prosjek ${fmtM(avgS)}/kom</small>` : "") + `</div></div>`;
      }).join("") : `<div class="dsub">Nema prometa u odabranom razdoblju.</div>`;
      renderChart(per_day || [], fi, ti);
      $("d-rows").innerHTML = recent.length ? recent.map((t) => {
        const m = state.meta.get(t.item);
        return `<tr><td>${esc(fmtDT(t.at))}</td>` +
          `<td class="${t.side}">${t.side === "buy" ? "Kupnja" : "Prodaja"}</td>` +
          `<td><span class="item-cell">${tile(t.item)}${esc(m ? m.name : t.item)}</span></td>` +
          `<td class="num">${fmt(t.quantity)}</td><td class="num money">${t.money == null ? "–" : fmtM(t.money)}</td><td>${esc(t.other_name || t.other_id)}</td></tr>`;
      }).join("") + (truncated ? `<tr><td colspan="7" class="empty">Prikazano zadnjih ${recent.length} transakcija.</td></tr>` : "") : `<tr><td colspan="7" class="empty">Nema transakcija u odabranom razdoblju.</td></tr>`;
    } catch { $("d-meta").textContent = "Greška pri učitavanju igrača."; }
  }
  $("d-close").onclick = () => $("dlg").close();
  $("dlg").addEventListener("click", (e) => { if (e.target === $("dlg")) $("dlg").close(); });

  /* ---------- pregled iznad tablice: cijena, sažetak, top danas ---------- */
  let ovKey = "";
  async function loadOverview() {
    const p = periodParams(new URLSearchParams());
    if ($("country").value) p.set("country", $("country").value);
    const key = p.toString();
    if (key === ovKey) return;
    ovKey = key;
    $("ov").setAttribute("aria-busy", "true");
    let d;
    try { d = await api("/api/overview?" + p); } catch { $("ov").setAttribute("aria-busy", "false"); return; }
    if (key !== ovKey) return;
    $("ov").setAttribute("aria-busy", "false");
    const m = state.meta.get(state.item);
    const name = m ? m.name : "item";
    const tot = d.by_country.reduce((a, r) => ({ bought: a.bought + r.bought, spent: a.spent + r.spent, sold: a.sold + r.sold, buyers: a.buyers + r.buyers }), { bought: 0, spent: 0, sold: 0, buyers: 0 });
    const q = d.by_day.reduce((a, r) => a + r.qty, 0), mny = d.by_day.reduce((a, r) => a + r.money, 0);
    $("ov-title").textContent = `Prosječna cijena · ${name}`;
    $("ov-kpi").innerHTML =
      `<div><small>Kupljeno</small><b>${fmt(tot.bought)}</b></div>` +
      `<div><small>Potrošeno</small><b>${fmtM(tot.spent)}</b></div>` +
      `<div><small>Prosječna cijena</small><b>${q ? fmtM(mny / q) : "–"}</b></div>` +
      `<div><small>Kupaca</small><b>${fmt(tot.buyers)}</b></div>`;
    renderPrice(d.by_day);
    $("ov-countries").innerHTML = d.by_country.length ? d.by_country.map((r) =>
      `<tr><td>${esc(r.country_name || "–")}</td><td class="num">${fmt(r.bought)}</td><td class="num">${fmtM(r.spent)}</td>` +
      `<td class="num">${r.bought ? fmtM(r.spent / r.bought) : "–"}</td></tr>`).join("")
      : `<tr><td colspan="4" class="empty">Nema prometa.</td></tr>`;
    $("ov-today-h").textContent = `Danas najviše kupili · ${isoToHr(d.today)}`;
    $("ov-today").innerHTML = d.today_top.length ? d.today_top.map((r, i) =>
      `<li data-id="${esc(r.user_id)}"><span class="rk">${i + 1}</span><button type="button">${esc(r.name || r.user_id)}</button>` +
      `<small>${esc(r.country_name || "")}</small><span class="num"><b>${fmt(r.bought)}</b> · ${fmtM(r.spent)}</span></li>`).join("")
      : `<li class="empty">Danas još nema kupnji ovog itema.</li>`;
  }

  // linijski graf prosječne cijene po danu (jedna serija, bez legende; naslov je imenuje)
  function renderPrice(days) {
    const box = $("ov-chart");
    box.textContent = "";
    const pts = days.filter((r) => r.qty > 0).map((r) => ({ day: r.day, qty: r.qty, price: r.money / r.qty }));
    if (!pts.length) { box.innerHTML = `<div class="dsub" style="padding:30px 0;text-align:center">Nema transakcija u odabranom razdoblju.</div>`; return; }
    let a = dateIso("from") || pts[0].day, b = dateIso("to") || pts[pts.length - 1].day;
    if (a > b) [a, b] = [b, a];
    const all = [];
    const byDay = new Map(pts.map((p) => [p.day, p]));
    for (let x = a; x <= b && all.length < 120; x = addDays(x, 1)) all.push(byDay.get(x) || { day: x, qty: 0, price: null });
    const prices = pts.map((p) => p.price);
    let lo = Math.min(...prices), hi = Math.max(...prices);
    const padv = (hi - lo) * 0.15 || hi * 0.05 || 1;
    lo = Math.max(0, lo - padv); hi = hi + padv;
    const W = 600, H = 150, n = all.length, slot = W / n;
    const X = (i) => slot * i + slot / 2, Y = (v) => H - 6 - ((v - lo) / (hi - lo)) * (H - 16);
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", role: "img", "aria-label": "Prosječna cijena po danu" });
    for (const t of [0.25, 0.5, 0.75]) svg.append(svgEl("line", { x1: 0, x2: W, y1: 6 + (H - 16) * t, y2: 6 + (H - 16) * t, class: "grid" }));
    let dPath = "", pen = false;
    all.forEach((r, i) => { if (r.price == null) { pen = false; return; } dPath += `${pen ? "L" : "M"}${X(i)},${Y(r.price)} `; pen = true; });
    svg.append(svgEl("path", { d: dPath, class: "pline" }));
    const cross = svgEl("line", { y1: 0, y2: H, class: "cross", visibility: "hidden" });
    svg.append(cross);
    const dot = document.createElement("span"); dot.className = "pdot"; dot.hidden = true;
    const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true;
    const show = (i) => {
      const r = all[i];
      cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("visibility", "visible");
      tip.textContent = "";
      const t1 = document.createElement("div"); t1.textContent = isoToHr(r.day);
      const t2 = document.createElement("div"); const v = document.createElement("b");
      v.textContent = r.price == null ? "nema transakcija" : fmtM(r.price); t2.append(v, r.price == null ? "" : " po komadu");
      tip.append(t1, t2);
      if (r.price != null) { const t3 = document.createElement("div"); t3.textContent = `${fmt(r.qty)} kom u transakcijama`; tip.append(t3); }
      tip.hidden = false;
      const bw = box.clientWidth, px = (X(i) / W) * bw;
      tip.style.left = Math.max(0, Math.min(px - tip.offsetWidth / 2, bw - tip.offsetWidth)) + "px";
      if (r.price != null) { dot.hidden = false; dot.style.left = px + "px"; dot.style.top = (Y(r.price) / H) * svg.getBoundingClientRect().height + "px"; } else dot.hidden = true;
    };
    const hide = () => { cross.setAttribute("visibility", "hidden"); tip.hidden = true; dot.hidden = true; };
    const hit = svgEl("rect", { x: 0, y: 0, width: W, height: H, fill: "transparent", tabindex: "0", "aria-label": "Pomakni za vrijednosti po danu" });
    const idxAt = (clientX) => { const r = svg.getBoundingClientRect(); return Math.max(0, Math.min(n - 1, Math.floor(((clientX - r.left) / r.width) * n))); };
    let cur = n - 1;
    hit.addEventListener("pointermove", (e) => { cur = idxAt(e.clientX); show(cur); });
    hit.addEventListener("pointerleave", hide);
    hit.addEventListener("focus", () => show(cur));
    hit.addEventListener("blur", hide);
    hit.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); cur = Math.max(0, Math.min(n - 1, cur + (e.key === "ArrowLeft" ? -1 : 1))); show(cur); } });
    svg.append(hit);
    const head = document.createElement("div"); head.className = "ov-axis";
    head.innerHTML = `<span>${fmtM(Math.min(...prices))} – ${fmtM(Math.max(...prices))} po komadu</span>`;
    const xl = document.createElement("div"); xl.className = "xlab";
    for (const i of [...new Set([0, Math.floor((n - 1) / 2), n - 1])]) { const t = document.createElement("span"); t.textContent = isoToHr(all[i].day).slice(0, 5); xl.append(t); }
    const wrap = document.createElement("div"); wrap.className = "pwrap";
    wrap.append(svg, dot);
    box.append(head, wrap, xl, tip);
  }
  $("ov-today").addEventListener("click", (e) => {
    const li = e.target.closest("li[data-id]");
    if (li) openPlayer(li.dataset.id, li.querySelector("button").textContent);
  });

  /* ---------- status: kašnjenje i potpunost podataka ---------- */
  const STALE_MS = 5 * 60 * 1000;
  function syncNote() {
    const cf = state.completeFrom;
    const from = dateIso("from");
    const show = cf && (!from || from <= cf.slice(0, 10));
    $("note").hidden = !show;
    if (show) $("note").textContent = `Podaci su potpuni tek od ${fmtDT(cf)}. Brojke za ranije dane su nepotpune` +
      (state.backfillDone ? "." : " jer se povijest još učitava (cilj: zadnjih 30 dana).");
  }

  /* ---------- status ---------- */
  async function loadStatus() {
    try {
      const s = await api("/api/status");
      const errs = Object.values(s.errors || {});
      state.completeFrom = s.complete_from || null; state.backfillDone = Boolean(s.backfill_done);
      syncNote(); if (!pop.hidden) renderCal();
      const age = s.last_run ? Date.now() - Date.parse(s.last_run) : Infinity;
      $("stale").hidden = age < STALE_MS;
      if (age >= STALE_MS) $("stale").textContent = s.last_run
        ? `Podaci kasne: zadnje osvježenje bilo je ${fmtDT(s.last_run)} (prije ${Math.round(age / 60000)} min). Najnovije transakcije možda još nisu prikazane.`
        : "Podaci se trenutno ne osvježavaju.";
      $("status").innerHTML =
        `Pohranjeno transakcija: <b>${fmt(s.transactions)}</b> · igrača: <b>${fmt(s.players)}</b> · ` +
        (s.backfill_done ? "povijest potpuno učitana" : "učitavanje povijesti je u tijeku" + (s.history_reached ? " (do " + esc(fmtDT(s.history_reached).slice(0, 10)) + ")" : "") + (s.history_paused ? ", danas pauzirano zbog dnevnog limita baze, nastavlja se u ponoć UTC" : "…")) +
        (s.last_run ? ` · zadnje osvježenje: <b>${esc(new Date(s.last_run).toLocaleTimeString("hr-HR"))}</b>` : "") +
        (errs.length ? `<br><span class="err">${esc(errs.join(" | "))}</span>` : "");
    } catch {}
  }

  /* ---------- start ---------- */
  // adresa stranice ima prednost pred zapamćenim izborom
  state.item = urlIn.get("item") || store.get("wm_item");
  if (SORTS.includes(urlIn.get("sort"))) state.sort = urlIn.get("sort");
  syncSortHeaders();
  setDates(validIso(urlIn.get("from")), validIso(urlIn.get("to")));
  if (urlIn.get("q")) $("q").value = urlIn.get("q");
  loadFilters().then(() => { load(); loadOverview(); }).catch(() => load());
  loadStatus();
  setInterval(loadStatus, 60000);
})();
</script>
</body>
</html>
