<!doctype html>
<html lang="hr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>WarEra Market Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // tema se postavlja prije prikaza stranice da ne bljesne pogrešna
  try { var t = localStorage.getItem("wm_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root {
    --bg: #0f1218; --panel: #171c26; --panel-2: #1b202b; --line: #232a38;
    --text: #ffffff; --text-2: #e6e9ef; --muted: #8b94a7; --gold: #ddbb00;
    --buy: #4ade80; --sell: #f87171; --hl: #223049; --hover: #1c2230;
    --tile-top: #0f1819; --tile-line: rgba(255,255,255,.08);
    --focus: #4cc9f0; --shadow: rgba(0,0,0,.6);
    --t-gray: #23373b; --t-green: #0a3d28; --t-blue: #173065; --t-purple: #3b235f; --t-red: #581b1d; --t-olive: #353610;
  }
  :root[data-theme="light"] {
    --bg: #f3f4f7; --panel: #ffffff; --panel-2: #f0f2f6; --line: #dde1e9;
    --text: #11151c; --text-2: #1c222d; --muted: #5d6678; --gold: #a88400;
    --buy: #15803d; --sell: #dc2626; --hl: #e2eaf6; --hover: #f4f6fa;
    --tile-line: rgba(0,0,0,.18); --focus: #0b79a8; --shadow: rgba(20,25,35,.45);
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  html[data-theme="light"] { color-scheme: light; }
  body { margin: 0; background: var(--bg); color: var(--text-2); font: 15px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 16px 56px; }

  h1.title { font: 400 34px/1.1 "Bowlby One", "Arial Black", Impact, sans-serif; margin: 0 0 18px; color: var(--text); letter-spacing: .2px; }
  h1.title span { color: var(--gold); }
  @media (max-width: 560px) { h1.title { font-size: 26px; } }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .field { position: relative; display: flex; align-items: center; background: var(--panel); border-radius: 10px; min-height: 48px; color: var(--text); border: 1px solid transparent; }
  .field:focus-within { border-color: var(--focus); }
  .field input, .field select { background: transparent; color: inherit; border: 0; font: inherit; font-size: 16px; padding: 0 14px; height: 46px; width: 100%; outline: none; }
  .field input::placeholder { color: var(--text); opacity: .85; }
  .field svg { flex: none; width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .search { flex: 1 1 260px; padding-right: 14px; }
  .search input { padding-right: 8px; }
  .search input::-webkit-search-cancel-button { display: none; }
  .select { flex: 0 0 190px; padding-right: 12px; }
  .select select { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 6px; }
  .select option { background: var(--panel); color: var(--text); }
  .date { flex: 0 0 188px; padding-left: 12px; gap: 8px; }
  .date .cal { display: grid; place-items: center; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; border-radius: 4px; }
  .date .native { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }
  .date input[aria-invalid=true] { color: var(--sell); }
  .date .lab { color: var(--muted); font-size: 13px; }
  .date input.txt { padding: 0 6px 0 0; height: 46px; min-width: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
  .date input.txt::placeholder { color: var(--muted); opacity: 1; }
  .spacer { flex: 1 1 0; min-width: 0; }
  .theme { position: relative; width: 62px; height: 32px; padding: 0; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; margin-left: auto; align-self: center; flex: none; }
  .theme::before { content: ""; box-sizing: border-box; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--hl); border: 1px solid var(--gold); transform: translateX(30px); }
  .theme[aria-checked=false]::before { transform: none; }
  .theme svg { position: absolute; top: 7px; width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .theme .sun { left: 7px; } .theme .moon { right: 7px; }
  .theme[aria-checked=true] .moon, .theme[aria-checked=false] .sun { stroke: var(--gold); }
  .theme:hover { border-color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) { .theme::before { transition: transform .2s; } }
  button:focus-visible, .tile:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* red itema */
  .items-wrap { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-wrap: nowrap; gap: 6px; align-items: center; overflow-x: auto; }
  .tile { --s: 36px; position: relative; width: var(--s); height: var(--s); flex: none; padding: 0; border: 1px solid var(--tile-line); border-radius: 6px; cursor: pointer; display: grid; place-items: center;
    background: linear-gradient(180deg, var(--tile-top) 0%, var(--tier, var(--t-gray)) 100%); transition: opacity .12s, transform .12s; }
  .tile img { width: 78%; height: 78%; object-fit: contain; pointer-events: none; }
  .t-gray { --tier: var(--t-gray); } .t-green { --tier: var(--t-green); } .t-blue { --tier: var(--t-blue); }
  .t-purple { --tier: var(--t-purple); } .t-red { --tier: var(--t-red); } .t-olive { --tier: var(--t-olive); }
  .items-wrap .tile:not(.on) { opacity: .42; }
  .items-wrap .tile:not(.on):hover { opacity: .85; }
  :root[data-theme="light"] .items-wrap .tile:not(.on) { opacity: .6; }
  .items-wrap .tile { --s: clamp(34px, calc((100vw - 180px) / 23), 42px); }
  .tile.on { outline: 2px solid var(--gold); outline-offset: 1px; }
  .tile:hover { transform: translateY(-1px); }
  .items-meta { display: flex; align-items: center; gap: 10px; margin: 8px 2px 0; color: var(--muted); font-size: 13px; min-height: 24px; }
  .items-meta b { color: var(--text-2); font-weight: 600; }

  /* tablica */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 14px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th, td { padding: 11px 14px; text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line); }
  td { border-bottom: 1px solid var(--line); }
  tbody tr:last-child td { border-bottom: 0; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.rank, th.rank { width: 56px; color: var(--muted); font-variant-numeric: tabular-nums; }
  th button { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
  th button:hover { color: var(--text); }
  th[aria-sort="descending"] button { color: var(--gold); }
  th[aria-sort="descending"] button::after { content: "↓"; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  td.name button { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; text-align: left; }
  td.main { color: var(--gold); font-weight: 700; }
  td.empty { padding: 36px; text-align: center; color: var(--muted); white-space: normal; }
  .card[aria-busy="true"] tbody { opacity: .55; }
  .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 10px; color: var(--muted); font-size: 13px; }
  .pager button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font: inherit; font-size: 14px; cursor: pointer; min-width: 110px; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .status { margin-top: 22px; color: var(--muted); font-size: 12px; }
  .status b { color: var(--text-2); font-weight: 600; }
  .err { color: var(--sell); }

  /* prozor igrača */
  dialog { background: var(--panel); color: var(--text-2); border: 1px solid var(--line); border-radius: 14px; width: min(760px, 94vw); padding: 0; }
  dialog::backdrop { background: var(--shadow); }
  .dhead { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 20px 6px; gap: 12px; }
  .dhead h2 { margin: 0; font-size: 20px; color: var(--text); }
  .dsub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .dhead button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 10px 20px 14px; max-height: 30vh; overflow: auto; }
  .chip { display: flex; gap: 10px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .chip .tile { --s: 34px !important; cursor: default; }
  .chip .tile { opacity: 1 !important; }
  .chip .tile:hover { transform: none; }
  .chip small { display: block; color: var(--muted); font-size: 11px; line-height: 1.3; }
  .chip span { font-variant-numeric: tabular-nums; font-size: 13px; }
  .dbody { max-height: 34vh; overflow: auto; border-top: 1px solid var(--line); }
  .dbody table { min-width: 0; }
  .dbody th, .dbody td { padding: 8px 14px; }
  .item-cell { display: inline-flex; align-items: center; gap: 8px; }
  .item-cell .tile { --s: 24px !important; cursor: default; border-radius: 4px; opacity: 1 !important; }
  .item-cell .tile:hover { transform: none; }
  .buy { color: var(--buy); } .sell { color: var(--sell); }
  @media (max-width: 560px) {
    table { min-width: 0; }
    th, td { padding: 10px 6px; font-size: 14px; }
    th { font-size: 11px; letter-spacing: .02em; }
    th:first-child, td:first-child { padding-left: 12px; }
    th:last-child, td:last-child { padding-right: 12px; }
    td.name, td:nth-child(3) { white-space: normal; overflow-wrap: anywhere; }
    th.rank, td.rank { width: 30px; }
    .field, .search, .select, .date { flex: 1 1 100%; }
    .date { flex: 1 1 calc(50% - 5px); }
  }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title"><span>WarEra</span> Market Rankings</h1>

  <div class="bar">
    <label class="field search">
      <input id="q" type="search" placeholder="Traži igrača" autocomplete="off" aria-label="Traži igrača">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </label>
    <div class="field select">
      <select id="country" aria-label="Država"><option value="">Država</option></select>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="field date">
      <button type="button" class="cal" data-for="from" aria-label="Odaberi datum (od)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
      <span class="lab">Od</span><input id="from" class="txt" type="text" inputmode="numeric" autocomplete="off" placeholder="dd/mm/yyyy" maxlength="10" aria-label="Od datuma (dd/mm/yyyy)">
      <input id="from-p" class="native" type="date" tabindex="-1" aria-hidden="true">
    </div>
    <div class="field date">
      <button type="button" class="cal" data-for="to" aria-label="Odaberi datum (do)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
      <span class="lab">Do</span><input id="to" class="txt" type="text" inputmode="numeric" autocomplete="off" placeholder="dd/mm/yyyy" maxlength="10" aria-label="Do datuma (dd/mm/yyyy)">
      <input id="to-p" class="native" type="date" tabindex="-1" aria-hidden="true">
    </div>
    <button type="button" class="theme" id="theme" role="switch" aria-checked="true" aria-label="Tamni način">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>

  <div class="items-wrap" id="items" role="group" aria-label="Itemi koji se prate"></div>
  <div class="items-meta"><span id="items-hint"></span></div>

  <div class="card" id="card" aria-busy="false"><div class="scroll">
    <table>
      <thead><tr>
        <th class="rank">#</th><th>Igrač</th><th>Država</th>
        <th class="num" id="th-bought" aria-sort="descending"><button type="button" data-sort="bought">Kupljeno</button></th>
        <th class="num" id="th-sold" aria-sort="none"><button type="button" data-sort="sold">Prodano</button></th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="empty">Učitavanje…</td></tr></tbody>
    </table>
  </div></div>

  <div class="pager">
    <button type="button" id="prev">← Prethodna</button>
    <span id="page"></span>
    <button type="button" id="next">Sljedeća →</button>
  </div>
  <div class="status" id="status"></div>
</div>

<dialog id="dlg" aria-labelledby="d-name">
  <div class="dhead">
    <div><h2 id="d-name"></h2><div class="dsub" id="d-meta"></div></div>
    <button type="button" id="d-close">Zatvori</button>
  </div>
  <div class="chips" id="d-chips"></div>
  <div class="dbody"><table>
    <thead><tr><th>Vrijeme</th><th>Tip</th><th>Item</th><th class="num">Kol.</th><th>Protustranka</th></tr></thead>
    <tbody id="d-rows"></tbody>
  </table></div>
</dialog>

<script>
(() => {
  const LIMIT = 50;
  const $ = (id) => document.getElementById(id);
  const state = { item: null, offset: 0, sort: "bought", meta: new Map(), seq: 0 };
  const fmtDT = (iso) => { const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const fmt = (n) => Number(n || 0).toLocaleString("hr-HR");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  async function api(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }

  /* ---------- tema ---------- */
  const themeBtn = $("theme");
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    themeBtn.setAttribute("aria-checked", String(t === "dark"));
    themeBtn.setAttribute("aria-label", t === "dark" ? "Prebaci na svijetli način" : "Prebaci na tamni način");
  }
  applyTheme(document.documentElement.dataset.theme === "light" ? "light" : "dark");
  themeBtn.addEventListener("click", () => {
    const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    applyTheme(t); store.set("wm_theme", t);
  });

  /* ---------- datumi (dd/mm/yyyy) ---------- */
  const pad = (n) => String(n).padStart(2, "0");
  const isoToHr = (iso) => (iso ? iso.split("-").reverse().join("/") : "");
  function hrToIso(v) {
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v);
    if (!m) return "";
    const iso = `${m[3]}-${m[2]}-${m[1]}`;
    const d = new Date(iso + "T00:00:00Z");
    return !Number.isNaN(d.getTime()) && d.toISOString().slice(0, 10) === iso ? iso : "";
  }
  const maskDate = (raw) => {
    const d = raw.replace(/\D/g, "").slice(0, 8);
    return d.length > 4 ? `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}/${d.slice(2)}` : d;
  };
  const dateIso = (id) => hrToIso($(id).value);
  for (const id of ["from", "to"]) {
    const inp = $(id), nat = $(id + "-p");
    inp.addEventListener("input", (e) => {
      const deleting = e.inputType && e.inputType.startsWith("delete");
      inp.value = deleting ? inp.value.replace(/[^\d/]/g, "").slice(0, 10) : maskDate(inp.value);
      const full = inp.value.length === 10;
      const iso = hrToIso(inp.value);
      inp.setAttribute("aria-invalid", String(full && !iso));
      if (iso) nat.value = iso;
      if (!inp.value || iso) reload();
    });
    nat.addEventListener("change", () => { inp.value = isoToHr(nat.value); inp.setAttribute("aria-invalid", "false"); reload(); });
  }
  for (const b of document.querySelectorAll(".date .cal")) {
    b.onclick = () => {
      const nat = $(b.dataset.for + "-p");
      try { nat.showPicker(); } catch { nat.focus(); }
    };
  }

  /* ---------- itemi ---------- */
  const tile = (code, extra = "") => {
    const m = state.meta.get(code) || { name: code, tier: "gray" };
    return `<span class="tile t-${esc(m.tier)} ${extra}" title="${esc(m.name)}"><img src="/icons/${encodeURIComponent(code)}.webp" alt="${esc(m.name)}" width="28" height="28" loading="lazy"></span>`;
  };

  function renderItems(items) {
    $("items").innerHTML = items.map((m) =>
      `<button type="button" class="tile t-${esc(m.tier)}" data-code="${esc(m.code)}" aria-pressed="false" aria-label="${esc(m.name)}" title="${esc(m.name)}">` +
      `<img src="/icons/${encodeURIComponent(m.code)}.webp" alt="" width="28" height="28"></button>`).join("");
    syncItems();
  }

  function syncItems() {
    for (const b of $("items").querySelectorAll(".tile")) {
      const on = b.dataset.code === state.item;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", String(on));
    }
    const m = state.meta.get(state.item);
    $("items-hint").innerHTML = m ? `Odabrani item: <b>${esc(m.name)}</b>` : "";
  }

  $("items").addEventListener("click", (e) => {
    const b = e.target.closest(".tile");
    if (!b || b.dataset.code === state.item) return;
    state.item = b.dataset.code;
    store.set("wm_item", state.item);
    syncItems();
    reload();
  });

  /* ---------- filteri ---------- */
  function periodParams(p) {
    let from = dateIso("from"), to = dateIso("to");
    if (from && to && from > to) [from, to] = [to, from];
    if (from) p.set("from", from);
    if (to) p.set("to", to);
    if (state.item) p.set("items", state.item);
    return p;
  }

  async function loadFilters() {
    const f = await api("/api/filters");
    state.meta = new Map(f.items.map((m) => [m.code, m]));
    renderItems(f.items);
    for (const c of f.countries) $("country").insertAdjacentHTML("beforeend", `<option value="${esc(c.id)}">${esc(c.name || c.id)}</option>`);
    if (f.days.min) $("from-p").min = $("to-p").min = f.days.min;
    if (f.days.max) $("from-p").max = $("to-p").max = f.days.max;
    if (!state.meta.has(state.item)) state.item = f.items[0] ? f.items[0].code : null;
    syncItems();
  }

  /* ---------- tablica ---------- */
  async function load() {
    const my = ++state.seq;
    const p = periodParams(new URLSearchParams({ limit: LIMIT, offset: state.offset, sort: state.sort }));
    if ($("q").value.trim()) p.set("q", $("q").value.trim());
    if ($("country").value) p.set("country", $("country").value);
    $("card").setAttribute("aria-busy", "true");
    let data;
    try { data = await api("/api/ranking?" + p); }
    catch { if (my === state.seq) { $("rows").innerHTML = `<tr><td colspan="5" class="empty err">Greška pri dohvaćanju podataka.</td></tr>`; $("card").setAttribute("aria-busy", "false"); } return; }
    if (my !== state.seq) return; // stigao je noviji zahtjev
    $("card").setAttribute("aria-busy", "false");
    const tb = $("rows");
    if (!data.rows.length) {
      tb.innerHTML = `<tr><td colspan="5" class="empty">Nema rezultata za odabrane filtere.</td></tr>`;
    } else {
      tb.innerHTML = data.rows.map((r) => `
        <tr data-id="${esc(r.user_id)}">
          <td class="rank">${r.rank}</td>
          <td class="name"><button type="button">${esc(r.name || r.user_id)}</button></td>
          <td>${esc(r.country_name || "–")}</td>
          <td class="num ${state.sort === "bought" ? "main" : ""}">${fmt(r.bought)}</td>
          <td class="num ${state.sort === "sold" ? "main" : ""}">${fmt(r.sold)}</td>
        </tr>`).join("");
    }
    $("prev").disabled = state.offset === 0;
    $("next").disabled = !data.hasMore;
    $("page").textContent = data.rows.length ? `Prikaz ${state.offset + 1}–${state.offset + data.rows.length}` : "";
  }

  const reload = () => { state.offset = 0; load(); };

  let timer;
  $("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(reload, 300); });
  $("country").addEventListener("change", reload);
  $("prev").onclick = () => { state.offset = Math.max(0, state.offset - LIMIT); load(); window.scrollTo({ top: 0 }); };
  $("next").onclick = () => { state.offset += LIMIT; load(); window.scrollTo({ top: 0 }); };
  for (const b of document.querySelectorAll("th button[data-sort]")) {
    b.onclick = () => {
      state.sort = b.dataset.sort;
      $("th-bought").setAttribute("aria-sort", state.sort === "bought" ? "descending" : "none");
      $("th-sold").setAttribute("aria-sort", state.sort === "sold" ? "descending" : "none");
      reload();
    };
  }

  /* ---------- prozor igrača ---------- */
  $("rows").addEventListener("click", async (e) => {
    const tr = e.target.closest("tr[data-id]");
    if (!tr) return;
    $("d-name").textContent = tr.querySelector(".name").textContent;
    $("d-meta").textContent = "Učitavanje…";
    $("d-chips").innerHTML = ""; $("d-rows").innerHTML = "";
    $("dlg").showModal();
    try {
      const p = periodParams(new URLSearchParams());
      const { player, per_item, recent, truncated } = await api("/api/player/" + encodeURIComponent(tr.dataset.id) + "?" + p);
      const fi = p.get("from"), ti = p.get("to");
      const period = fi || ti ? ` · ${isoToHr(fi) || "početak"} – ${isoToHr(ti) || "danas"}` : " · cijelo razdoblje";
      $("d-meta").textContent = (player.country_name || "ID " + player.user_id) + period;
      $("d-chips").innerHTML = per_item.length ? per_item.map((r) => {
        const m = state.meta.get(r.item_code);
        return `<div class="chip">${tile(r.item_code)}<div><small>${esc(m ? m.name : r.item_code)}</small>` +
          `<span class="buy">K ${fmt(r.bought)}</span> <span class="sell">P ${fmt(r.sold)}</span></div></div>`;
      }).join("") : `<div class="dsub">Nema prometa u odabranom razdoblju.</div>`;
      $("d-rows").innerHTML = recent.length ? recent.map((t) => {
        const m = state.meta.get(t.item);
        return `<tr><td>${esc(fmtDT(t.at))}</td>` +
          `<td class="${t.side}">${t.side === "buy" ? "Kupnja" : "Prodaja"}</td>` +
          `<td><span class="item-cell">${tile(t.item)}${esc(m ? m.name : t.item)}</span></td>` +
          `<td class="num">${fmt(t.quantity)}</td><td>${esc(t.other_name || t.other_id)}</td></tr>`;
      }).join("") + (truncated ? `<tr><td colspan="5" class="empty">Prikazano zadnjih ${recent.length} transakcija.</td></tr>` : "") : `<tr><td colspan="5" class="empty">Nema transakcija u odabranom razdoblju.</td></tr>`;
    } catch { $("d-meta").textContent = "Greška pri učitavanju igrača."; }
  });
  $("d-close").onclick = () => $("dlg").close();
  $("dlg").addEventListener("click", (e) => { if (e.target === $("dlg")) $("dlg").close(); });

  /* ---------- status ---------- */
  async function loadStatus() {
    try {
      const s = await api("/api/status");
      const errs = Object.values(s.errors || {});
      $("status").innerHTML =
        `Pohranjeno transakcija: <b>${fmt(s.transactions)}</b> · igrača: <b>${fmt(s.players)}</b> · ` +
        (s.backfill_done ? "povijest potpuno učitana" : "učitavanje povijesti je u tijeku" + (s.history_reached ? " (do " + esc(fmtDT(s.history_reached).slice(0, 10)) + ")" : "") + "…") +
        (s.last_run ? ` · zadnje osvježenje: <b>${esc(new Date(s.last_run).toLocaleTimeString("hr-HR"))}</b>` : "") +
        (errs.length ? `<br><span class="err">${esc(errs.join(" | "))}</span>` : "");
    } catch {}
  }

  /* ---------- start ---------- */
  state.item = store.get("wm_item");
  loadFilters().then(() => load()).catch(() => load());
  loadStatus();
  setInterval(loadStatus, 60000);
})();
</script>
</body>
</html>
